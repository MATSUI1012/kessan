name: Update stock prices (v10)
'on':
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests yfinance
      - name: Deploy v10 app and price updater on manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          packed = ''
          files = json.loads(gzip.decompress(base64.b64decode(packed)).decode('utf-8'))
          for name, content in files.items():
              Path(name).write_text(content, encoding='utf-8')
              print('Installed:', name)
          PY
      - name: Fetch prices and market caps
        run: python update-prices.py
      - name: Commit updated app and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html update-prices.py data/prices.json data/market-caps.json
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy v10, update prices and market caps'
            git push
          fi
