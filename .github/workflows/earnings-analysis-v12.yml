name: Earnings analysis v12.1 verified
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/earnings-analysis-v12.yml'
  schedule:
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: earnings-analysis-v12
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install verified application files
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip, json
          from pathlib import Path
          files=json.loads(gzip.decompress(base64.b64decode('')).decode('utf-8'))
          for name,content in files.items():
              Path(name).write_text(content,encoding='utf-8')
              print('Prepared',name)
          PYCODE
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3' 'yfinance>=0.2.60,<1' 'pandas>=2,<3'
      - name: Update earnings research
        run: python research.py --limit 20
      - name: Validate actual snapshot before publishing
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, datetime
          from pathlib import Path
          data=json.loads(Path('data/research.json').read_text(encoding='utf-8'))
          assert isinstance(data.get('records'),list)
          assert data['count']==len(data['records'])<=20
          assert len({r['code'] for r in data['records']})==data['count']
          assert all(0<r['market_cap_yen']<100_000_000_000 for r in data['records'])
          assert all(r['turnover_oku']>=2 for r in data['records'])
          assert all(not r.get('analyst_consensus') or r['analyst_consensus'].get('analyst_count',0)>=1 for r in data['records'])
          assert all(all('予想データあり' not in v['label'] or r.get('analyst_consensus',{}).get('analyst_count',0)>=1 for v in r['signals']) for r in data['records'])
          assert '決算ギャンブルAI v12.1' in Path('index.html').read_text(encoding='utf-8')
          print('VALIDATION OK',data['count'])
          PYCODE
      - name: Retain validated files even if GitHub push fails
        uses: actions/upload-artifact@v4
        with:
          name: earnings-analysis-v12-1-validated
          path: |
            index.html
            research.py
            data/research.json
          retention-days: 7
      - name: Publish updated research with retries
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html research.py data/research.json
          if git diff --cached --quiet; then
            echo 'No change needed'; exit 0
          fi
          git commit -m 'Correct earnings forecast evidence checks and update research'
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              echo 'PUBLISHED v12.1'; exit 0
            fi
            sleep $((n*5))
          done
          echo 'Push failed; validated artifact is available in Actions' >&2
          exit 1
