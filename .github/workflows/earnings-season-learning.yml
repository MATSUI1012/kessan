name: Freeze pre-earnings evidence and audit season learning
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/earnings-season-learning.yml
  schedule:
  - cron: 20 21 * * 1-5
permissions:
  contents: write
concurrency:
  group: earnings-season-learning
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Save immutable pre-earnings snapshots and feedback
      shell: bash
      run: "set -euo pipefail\npython - <<'PYCODE'\nimport json, math, os\nfrom collections import defaultdict\nfrom datetime import datetime, date, timedelta, timezone\nfrom pathlib import Path\n\nROOT=Path('data'); JST=timezone(timedelta(hours=9))\nTODAY=datetime.now(JST).date()\nSTART=date(2026,10,1); END=date(2026,11,30)\n\ndef read(name, default):\n    try:return json.loads((ROOT/name).read_text(encoding='utf-8'))\n    except (OSError,ValueError):return default\n\ndef save(name,obj):\n    (ROOT/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\n\ndef day(x):\n    try:return date.fromisoformat(str(x)[:10])\n    except (ValueError,TypeError):return None\n\ndef validnum(x):return isinstance(x,(int,float)) and not isinstance(x,bool) and math.isfinite(x)\n\ncalendar=read('earnings-calendar-history.json',{'events':[]})\nresearch=read('research.json',{'records':[]})\nstrict=read('earnings-strict-ranking.json',{'records':[]})\nreactions=read('earnings-nextday-reactions.json',{'records':[]})\n\
        old=read('season-learning.json',{'snapshots':[]})\n# The season denominator is all unique JPX-scheduled companies in Oct-Nov,\n# not the 20 selected candidates. Dates are scheduled, not proved announcements.\nseason={}\nfor e in calendar.get('events',[]):\n    code=str(e.get('code','')).strip(); d=day(e.get('scheduled_date'))\n    if code and d and START<=d<=END and (code not in season or d<season[code]):season[code]=d\n\n# Freeze the candidate attributes while the scheduled earnings date is still in\n# the future, independently of whether the four-factor model can rank it.\nseen={}\nfor x in old.get('snapshots',[]):\n    if not isinstance(x,dict):continue\n    key=(str(x.get('code','')),str(x.get('earnings_date','')))\n    observed=day(x.get('captured_at'))\n    event=day(x.get('earnings_date'))\n    if observed and event and observed<event and key not in seen:seen[key]=x\n\nstrictmap={str(x['code']):x for x in strict.get('records',[]) if isinstance(x,dict) and x.get('code')}\n\
        for r in research.get('records',[]):\n    code=str(r.get('code','')); d=day(r.get('earnings_date'))\n    if not d or d<=TODAY:continue\n    key=(code,d.isoformat())\n    if key in seen:continue\n    sm=strictmap.get(code)\n    financial=r.get('financials') or {}\n    consensus=r.get('analyst_consensus') or {}\n    seen[key]={\n        'code':code,'name':r.get('name'),'earnings_date':d.isoformat(),\n        'captured_at':datetime.now(JST).isoformat(timespec='seconds'),\n        'officially_rankable':bool(sm),\n        'strict_score':sm.get('score_total') if sm else None,\n        'strict_components':sm.get('score_components') if sm else None,\n        'pre_event_factors':{\n            'volume_ratio_5_20':r.get('volume_ratio_5_20') if validnum(r.get('volume_ratio_5_20')) else None,\n            'return_5d_pct':r.get('return_5d') if validnum(r.get('return_5d')) else None,\n            'analyst_count':consensus.get('analyst_count'),\n            'revenue_consensus_yen':consensus.get('revenue_mean_yen'),\n\
        \            'company_guidance_revision':None,\n            'shikiho_forecast_revision':None,\n            'target_price_revision':None,\n            'rating_upgrade':None,\n            'new_news_impact':None,\n        },\n        'missing_core_factors':['company_guidance_revision','shikiho_forecast_revision','target_price_revision','rating_upgrade','new_news_impact'],\n        'evidence_note':'四季報・会社予想・目標株価・格付け・ニュースの変更データは未取得。点数には換算しない。'\n    }\n\n# Require outcomes to be observed strictly after the scheduled date. The\n# observed return is not necessarily the causal earnings announcement effect.\noutcomes={}\nfor e in reactions.get('records',[]):\n    code=str(e.get('code','')); d=day(e.get('scheduled_date'))\n    nextday=day(e.get('next_session_date')); pct=e.get('next_close_pct')\n    if not code or not d or not nextday or nextday<=d or nextday>TODAY or not validnum(pct):continue\n    key=(code,d.isoformat())\n    if key not in outcomes or e.get('ohlc_complete'):\n        outcomes[key]={'next_session_date':nextday.isoformat(),'next_close_pct':round(pct,3),'return_is_causal':False,'date_kind':e.get('date_kind'),'source_url':e.get('source_url')}\n\
        \nobservations=[]\nfor key,s in seen.items():\n    o=outcomes.get(key)\n    if not o:continue\n    observations.append({**s,'outcome':o,'up':o['next_close_pct']>0})\nobservations.sort(key=lambda x:(x['earnings_date'],x['code']))\n\npast_count=sum(d<TODAY for d in season.values())\n# Used as a schedule-progress proxy only, not as a verified earnings completion count.\ndenominator=len(season)\nratio=past_count/denominator if denominator else 0\n\ndef group_stats(items):\n    vals=[x['outcome']['next_close_pct'] for x in items]\n    return {'n':len(vals),'up':sum(x>0 for x in vals),'down':sum(x<0 for x in vals),'unchanged':sum(x==0 for x in vals),\n            'up_rate':round(sum(x>0 for x in vals)/len(vals),4) if vals else None,\n            'average_return_pct':round(sum(vals)/len(vals),3) if vals else None}\n\n# Exploratory calibration of ONE factor, on genuinely pre-event snapshots.\n# No causal interpretations and no automatic changing the selection weights.\nlearned=[]\nfor key,threshold\
        \ in [('volume_ratio_5_20',1.5),('return_5d_pct',0)]:\n    usable=[x for x in observations if validnum(x.get('pre_event_factors',{}).get(key))]\n    high=[x for x in usable if x['pre_event_factors'][key]>=threshold]\n    low=[x for x in usable if x['pre_event_factors'][key]<threshold]\n    learned.append({'factor':key,'split_at':threshold,'higher':group_stats(high),'lower':group_stats(low),\n        'enough_for_exploratory_comparison':len(high)>=10 and len(low)>=10,\n        'note':'観察値による比較。決算発表に起因する効果は識別していません。'})\n\nmilestones=[]\nfor t in (0.2,0.6):\n    reached=ratio>=t\n    milestones.append({'fraction':t,'schedule_threshold_reached':reached,\n        'observations_from_frozen_pre_earnings_snapshots':len(observations),\n        'feedback_ready':bool(reached and len(observations)>=30 and any(f['enough_for_exploratory_comparison'] for f in learned)),\n        'next_action':'検証済み標本30件以上で要因差を点検。重みを自動変更せず、別期間で再検証' if reached else '決算予定日の経過と決算前スナップショットを蓄積'})\nresult={\n  'schema':1,'generated_at':datetime.now(JST).isoformat(timespec='seconds'),\n\
        \  'season':{'start':START.isoformat(),'end':END.isoformat(),'scope':'JPX予定表の10-11月ユニーク銘柄（時価総額を問わない）',\n            'scheduled_count':denominator,'scheduled_dates_elapsed_before_today':past_count,\n            'scheduled_progress_fraction':round(ratio,4)},\n  'coverage':{'frozen_pre_event_snapshots':len(seen),'matched_subsequent_returns':len(observations),'complete_four_factor_scores_matched':sum(x['officially_rankable'] for x in observations),\n              'unavailable_factors':['四季報の事前予想改定','会社予想改定','目標株価変更履歴','レーティング変更履歴','ニュースの定量化']},\n  'milestones':milestones,'observations_summary':group_stats(observations),\n  'factor_diagnostics':learned,\n  'notes':['決算前に保存していない評価は過去の予測点数として復元しない','JPX予定日を実際の開示日とみなさない',\n           '予定日直前の終値と翌営業日の終値を比較。株価変動の原因は断定しない',\n           '未取得項目は0点にしない。検証が足りない段階で重みの自動更新や銘柄ランキングは行わない'],\n  'snapshots':sorted(seen.values(),key=lambda x:(x['earnings_date'],x['code'])),'matched_events':observations\n}\nsave('season-learning.json',result)\nprint('SEASON_LEARNING',json.dumps({'season':result['season'],'coverage':result['coverage'],'milestones':milestones},ensure_ascii=False))\n\
        \nPYCODE"
    - name: Commit season-learning data
      shell: bash
      run: "set -euo pipefail\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add data/season-learning.json\nif git diff --cached --quiet; then echo 'No change'; exit 0; fi\ngit commit -m 'Freeze pre-earnings research and audit season learning'\nfor n in 1 2 3; do\n  git fetch origin main\n  git rebase origin/main || { git rebase --abort; exit 1; }\n  if git push origin HEAD:main; then exit 0; fi\n  sleep $((n*5))\ndone\nexit 1"
