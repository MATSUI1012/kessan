name: Backfill own earnings from structured IR archive
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/earnings-own-history-archive.yml
  schedule:
  - cron: 45 17 * * 1-5
permissions:
  contents: write
concurrency:
  group: earnings-own-history-archive
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install HTML parser
      run: python -m pip install -q requests beautifulsoup4
    - name: Read dated disclosure archive and update own returns only
      shell: python {0}
      run: "from __future__ import annotations\nimport json, math, re, time\nfrom collections import defaultdict\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom datetime import date, datetime, timedelta, timezone\nfrom pathlib import Path\nfrom urllib.parse import urljoin, urlparse\nimport requests\nfrom bs4 import BeautifulSoup\n\nJST = timezone(timedelta(hours=9))\nnow = datetime.now(JST)\ntoday = now.date()\nfolder = Path('data')\nresearch = json.loads((folder/'research.json').read_text(encoding='utf-8'))\nranking_path = folder/'earnings-four-factor-ranking.json'\nranking = json.loads(ranking_path.read_text(encoding='utf-8'))\nhistory_path = folder/'own-earnings-history.json'\nold = json.loads(history_path.read_text(encoding='utf-8')) if history_path.exists() else {'records': []}\nassert research['screening']['market_cap_min_yen_inclusive'] == 8_000_000_000\nassert research['screening']['market_cap_max_yen_exclusive'] == 100_000_000_000\nassert research['screening']['min_latest_turnover_oku']\
        \ == 0\nassert isinstance(ranking.get('records'), list)\nold_by = {str(x['code']): x for x in old.get('records', []) if isinstance(x,dict) and x.get('code')}\ncandidates = [{'code':str(x['code']), 'name':x.get('name',''), 'earnings_date':str(x['earnings_date'])[:10]} for x in research['records']]\nassert candidates and len({x['code'] for x in candidates}) == len(candidates)\n\nDAY_PAT = re.compile(r'(?<![0-9])(20(?:2[0-9]|1[0-9]))[年/\\-.]\\s*(0?[1-9]|1[0-2])[月/\\-.]\\s*([0-3]?\\d)日?(?!\\d)')\nBLOCKED = ('訂正','再訂正','決算説明','説明資料','開示延期','発表予定','業績予想','決算短信の一部')\n\ndef detect_date(s):\n    for match in DAY_PAT.finditer(str(s)):\n        try:\n            y,m,d=map(int,match.groups())\n            return date(y,m,d)\n        except ValueError:\n            continue\n    return None\n\ndef earnings_link_title(title):\n    t=re.sub(r'\\s+','',title)\n    return '決算短信' in t and not any(w in t for w in BLOCKED)\n\ndef parse_irbank(html, code, page_url, start, end):\n    soup=BeautifulSoup(html,'html.parser')\n\
        \    title=soup.title.get_text(' ',strip=True) if soup.title else ''\n    # Accept only the ticker's page, never a search result for a different company.\n    if not re.search(r'(?<!\\d)'+re.escape(code)+r'(?!\\d)',title):\n        return [], 'ticker_not_in_title'\n    collected={}\n    for a in soup.find_all('a',href=True):\n        name=a.get_text(' ',strip=True)\n        if not earnings_link_title(name):\n            continue\n        href=urljoin(page_url,a['href'])\n        parsed=urlparse(href)\n        if parsed.scheme!='https' or not (parsed.netloc=='irbank.net' or parsed.netloc.endswith('.irbank.net')):\n            continue\n        # The same table row/list item must contain a full YYYY-MM-DD date.\n        container=a.find_parent(['tr','li','article'])\n        if container is None:\n            container=a.find_parent('div')\n        context=container.get_text(' ',strip=True)[:500] if container else a.parent.get_text(' ',strip=True)[:180]\n        # Date preceding the\
        \ anchor is preferred, avoiding fiscal-period dates in the title.\n        context_before=context.split(name,1)[0] if name in context else ''\n        when=detect_date(context_before) or detect_date(context)\n        if when is None or not (start<=when<end):\n            continue\n        key=when.isoformat()\n        collected[key]={'event_date':key,'date_kind':'IR BANK決算短信掲載一覧の日付（発表時刻未確認）',\n                        'source_url':href,'headline':name[:250],'discovered_via':'IR BANK 銘柄別開示一覧'}\n    return list(collected.values()),'ok'\n\ndef safe_old(r):\n    return [e for e in r.get('events',[]) if isinstance(e,dict) and e.get('next_close_pct') is not None\n            and e.get('baseline_date') and e.get('next_session_date') and str(e.get('source_url','')).startswith('https://')]\n\ndef get_price_series(code):\n    url=f'https://query1.finance.yahoo.com/v8/finance/chart/{code}.T'\n    start=int((datetime.now(timezone.utc)-timedelta(days=790)).timestamp())\n    end=int((datetime.now(timezone.utc)+timedelta(days=2)).timestamp())\n\
        \    resp=requests.get(url,params={'period1':start,'period2':end,'interval':'1d'},\n                      headers={'User-Agent':'Mozilla/5.0'},timeout=20)\n    resp.raise_for_status()\n    payload=resp.json()['chart']['result'][0]\n    result={}\n    for ts,close in zip(payload.get('timestamp') or [],payload['indicators']['quote'][0]['close']):\n        try:\n            d=datetime.fromtimestamp(ts,JST).date()\n            v=float(close)\n            if math.isfinite(v) and v>0 and d<=today:result[d]=v\n        except (ValueError, TypeError, OverflowError):continue\n    return result\n\ndef compute(source,series):\n    try:day=date.fromisoformat(source['event_date'])\n    except (ValueError, KeyError):return None\n    pre=sorted(d for d in series if d<day)\n    post=sorted(d for d in series if d>day)\n    if not pre or not post or (day-pre[-1]).days>7 or (post[0]-day).days>7:return None\n    base=series[pre[-1]]\n    pct=lambda d:round((series[d]/base-1)*100,2)\n    return {**source,'baseline_date':pre[-1].isoformat(),'baseline_close':round(base,4),\n\
        \            'next_session_date':post[0].isoformat(),'next_close_pct':pct(post[0]),\n            'after_3d_pct':pct(post[2]) if len(post)>=3 else None,\n            'after_5d_pct':pct(post[4]) if len(post)>=5 else None,\n            'price_source':'Yahoo Finance 日足'}\n\ndef work(candidate):\n    code=candidate['code']\n    previous=old_by.get(code,{'code':code,'name':candidate['name'],'events':[]})\n    old_events=safe_old(previous)\n    last_eligible=min(today-timedelta(days=3),date.fromisoformat(candidate['earnings_date'])-timedelta(days=7))\n    start=today-timedelta(days=730)\n    discovered=[]\n    diagnostics=[]\n    for url in (f'https://irbank.net/{code}/ir',f'https://irbank.net/{code}'):\n        try:\n            resp=requests.get(url,timeout=16,headers={'User-Agent':'Mozilla/5.0 (compatible; earnings-history/1.0)'})\n            if resp.status_code!=200:\n                diagnostics.append(f'HTTP {resp.status_code}');continue\n            events,status=parse_irbank(resp.text,code,url,start,last_eligible)\n\
        \            diagnostics.append(f'{status}:{len(events)}')\n            discovered.extend(events)\n            if events:break\n        except requests.RequestException as exc:\n            diagnostics.append(type(exc).__name__)\n    by_day={str(e['event_date']):e for e in old_events}\n    pending=[]\n    for e in discovered:\n        d=date.fromisoformat(e['event_date'])\n        if any(abs((d-date.fromisoformat(x)).days)<=2 for x in by_day):\n            continue\n        if any(abs((d-date.fromisoformat(x['event_date'])).days)<=2 for x in pending):\n            continue\n        pending.append(e)\n    fetched=0\n    if pending:\n        try:\n            series=get_price_series(code)\n            for e in pending:\n                calculated=compute(e,series)\n                if calculated:\n                    by_day[e['event_date']]=calculated\n                    fetched+=1\n        except (requests.RequestException, KeyError, ValueError, IndexError) as exc:\n            diagnostics.append('price_'+type(exc).__name__)\n\
        \    saved=sorted(by_day.values(),key=lambda e:e['event_date'],reverse=True)[:12]\n    return {'code':code,'name':candidate['name'],'events':saved,\n            'status':'決算短信の日付と終値照合済' if saved else '過去の決算日時・株価を確認できず',\n            'irbank_diagnostics':diagnostics,'new_events':fetched}\n\nresults={}\nwith ThreadPoolExecutor(max_workers=4) as pool:\n    futures={pool.submit(work,c):c for c in candidates}\n    for f in as_completed(futures):\n        c=futures[f]\n        try:results[c['code']]=f.result()\n        except Exception as exc:\n            print('CANDIDATE_ERROR',c['code'],type(exc).__name__)\n            previous=old_by.get(c['code'],{})\n            results[c['code']]={'code':c['code'],'name':c['name'],'events':safe_old(previous),'status':'今回の取得失敗、既存履歴維持','new_events':0}\n\n# Rebuild the own-history score only; leave peer, volume, upgrades untouched.\nfor row in ranking['records']:\n    code=str(row['code'])\n    data=results.get(code)\n    if not data:continue\n   \
        \ history=[e for e in data['events'] if e.get('next_close_pct') is not None and e['event_date']<row['earnings_date']][:4]\n    positives=sum(e['next_close_pct']>0 for e in history)\n    ownscore=(3 if len(history)>=3 and positives/len(history)>=.75 else\n              2 if len(history)>=2 and positives/len(history)>=.6 else\n              1 if len(history)==1 and positives==1 else 0)\n    row['self_history_count']=len(history)\n    row['self_history_positive']=positives\n    row['self_history_events']=[{'date':e['event_date'],'next_close_pct':e['next_close_pct'],\n                                 'date_kind':e.get('date_kind'),'source_url':e.get('source_url')} for e in history]\n    row['score_components']['own_earnings_reaction']=ownscore\n    row['score_total']=sum(row['score_components'].values())\n    row.setdefault('data_coverage',{})['self_history']=bool(history)\n    assert 0<=row['score_total']<=12\nranking['records'].sort(key=lambda r:(-r['score_total'],-sum(bool(v) for\
        \ v in r.get('data_coverage',{}).values()),r['earnings_date'],r['code']))\nranking['coverage']['own_history']=sum(r['self_history_count']>0 for r in ranking['records'])\nranking['generated_at']=now.isoformat(timespec='seconds')\nranking['own_history_source']='IR BANK決算短信一覧、以前から保存されている根拠付き決算日。発表時刻は未確認。'\ncoverage={'candidates':len(candidates),'with_history':sum(bool(x['events']) for x in results.values()),\n          'events':sum(len(x['events']) for x in results.values()),\n          'new_events':sum(x.get('new_events',0) for x in results.values())}\noutput={'schema':3,'updated_at':now.isoformat(timespec='seconds'),\n        'method':'IR BANKの銘柄別開示一覧で決算短信の行に記載された日付とYahoo日足を照合。日付や終値が未確認なら過去履歴を保持しつつ加点しない。',\n        'coverage':coverage,'records':[results[x['code']] for x in candidates]}\n# Fail-safe: do not silently lose previously stored events.\nold_count=sum(len(safe_old(old_by.get(x['code'],{}))) for x in candidates)\nassert coverage['events']>=old_count,(coverage,old_count)\n\
        assert len(ranking['records'])==len(candidates)\nhistory_path.write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nranking_path.write_text(json.dumps(ranking,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nprint('IRBANK_HISTORY',json.dumps(coverage,ensure_ascii=False))\nprint('DIAGNOSTICS',{k:x.get('irbank_diagnostics',[]) for k,x in results.items() if not x['events']})\nprint('TOP5',[(r['code'],r['score_total'],r['self_history_count']) for r in ranking['records'][:5]])\n"
    - name: Publish sourced history only
      shell: bash
      run: "set -e\n git config user.name 'github-actions[bot]'\n git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n git add data/own-earnings-history.json data/earnings-four-factor-ranking.json\n if git diff --cached --quiet; then echo 'No changes'; exit 0; fi\n git commit -m 'Backfill own earnings from dated IR archive'\n for i in 1 2 3; do\n   git fetch origin main\n   git rebase origin/main || { git rebase --abort; exit 1; }\n   if git push origin HEAD:main; then exit 0; fi\n   sleep $((i*5))\n done\n exit 1"
