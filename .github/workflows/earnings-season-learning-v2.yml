name: Season learning v2 - broad frozen cohort
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/earnings-season-learning-v2.yml
  schedule:
  - cron: 10 12 * * 1-5
permissions:
  contents: write
concurrency:
  group: earnings-season-learning-v2
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Freeze all eligible pre-earnings factors, join next-session outcomes, validate milestones
      shell: bash
      run: "set -euo pipefail\npython - <<'PYCODE'\nfrom __future__ import annotations\nimport json,math\nfrom collections\
        \ import defaultdict\nfrom datetime import datetime,date,timedelta,timezone\nfrom pathlib import Path\nD=Path('data');\
        \ JST=timezone(timedelta(hours=9)); now=datetime.now(JST); today=now.date()\nseason_start=date(2026,10,1); season_end=date(2026,11,30)\n\
        def load(p,default):\n try: return json.loads((D/p).read_text(encoding='utf-8'))\n except (OSError,ValueError): return\
        \ default\ndef iso(s):\n try:return date.fromisoformat(str(s)[:10])\n except (ValueError,TypeError):return None\n\
        def num(x):\n try:\n  if x is None or isinstance(x,bool):return None\n  v=float(x)\n  return v if math.isfinite(v)\
        \ else None\n except (TypeError,ValueError):return None\ncal=load('earnings-calendar-history.json',{'events':[]}).get('events',[])\n\
        caps=load('market-caps.json',[])\nprices=load('prices.json',[])\nnames=load('earnings.json',[])\nreturns=load('earnings-nextday-reactions.json',{'records':[]}).get('records',[])\n\
        prior=load('season-learning-v2.json',{'snapshots':[]})\nname_map={str(x['code']):x.get('name') for x in names if isinstance(x,dict)\
        \ and x.get('code')}\ncapmap={str(x['code']):num(x.get('market_cap_yen')) for x in caps if isinstance(x,dict) and\
        \ x.get('code')}\ncapmap={k:v for k,v in capmap.items() if v is not None and 8e9<=v<100e9}\n# Do not rank securities\
        \ by presence in the previous 20-stock shortlist.\nevents={}\nfor e in cal:\n if not isinstance(e,dict):continue\n\
        \ code=str(e.get('code') or '');d=iso(e.get('scheduled_date'))\n if code not in capmap or d is None or not(season_start<=d<=season_end):continue\n\
        \ if code not in events or d<events[code]['date']:\n  events[code]={'date':d,'source_url':e.get('source_url')}\n#\
        \ Reduce 60MB source to relevant securities and valid historical sessions.\nseries=defaultdict(dict)\nfor row in prices:\n\
        \ if not isinstance(row,dict):continue\n code=str(row.get('code') or '')\n if code not in capmap:continue\n d=iso(row.get('date'));close=num(row.get('close'));vol=num(row.get('volume'))\n\
        \ if d and d<=today and close is not None and close>0:\n  series[code][d]=(close,vol)\n# Keep only snapshots whose\
        \ recorded timestamp is strictly before the event.\nfrozen={}\nfor s in prior.get('snapshots',[]):\n if not isinstance(s,dict):continue\n\
        \ code=str(s.get('code',''));d=iso(s.get('earnings_date'));captured=iso(s.get('captured_at'))\n if code in capmap\
        \ and d and captured and captured<d:\n  frozen.setdefault((code,d.isoformat()),s)\nnew_count=0\nfor code,e in events.items():\n\
        \ d=e['date']\n if not (today<d<=today+timedelta(days=21)):continue\n key=(code,d.isoformat())\n if key in frozen:continue\n\
        \ eligible=sorted((p,values) for p,values in series.get(code,{}).items() if p<d)\n if not eligible:continue\n last_date,(last_close,last_volume)=eligible[-1]\n\
        \ if (today-last_date).days>8:continue\n p5=eligible[-5:];p20=eligible[-25:-5]\n vol5=[v for _,(_,v) in p5 if v is\
        \ not None and v>=0]\n vol20=[v for _,(_,v) in p20 if v is not None and v>=0]\n vr=round((sum(vol5)/len(vol5))/(sum(vol20)/len(vol20)),4)\
        \ if len(vol5)==5 and len(vol20)==20 and sum(vol20)>0 else None\n ret5=round((last_close/eligible[-6][1][0]-1)*100,3)\
        \ if len(eligible)>=6 else None\n frozen[key]={'code':code,'name':name_map.get(code) or code,'earnings_date':d.isoformat(),\n\
        \  'captured_at':now.isoformat(timespec='seconds'),'source_url':e['source_url'],\n  'market_cap_oku_at_capture':round(capmap[code]/1e8,2),'price_asof':last_date.isoformat(),\n\
        \  'pre_event_factors':{'volume_ratio_5_20':vr,'return_5d_pct':ret5},\n  'formally_ranked':False,'strict_score':None,\n\
        \  'missing_score_evidence':['本人の過去決算反応','四季報・会社予想の改定履歴','レーティング・目標株価の改定履歴','ニュース根拠の検証'],\n  'remark':'学習用観測であり正式候補ではない。未取得を0点として採点しない。'}\n\
        \ new_count+=1\noutcomes={}\nfor r in returns:\n if not isinstance(r,dict):continue\n code=str(r.get('code') or '');d=iso(r.get('scheduled_date'));after=iso(r.get('next_session_date'));pct=num(r.get('next_close_pct'))\n\
        \ if code not in capmap or not d or not after or after<=d or after>today or pct is None:continue\n key=(code,d.isoformat())\n\
        \ if key not in outcomes or (r.get('ohlc_complete') and not outcomes[key]['ohlc_complete']):\n  outcomes[key]={'next_session_date':after.isoformat(),'next_close_pct':pct,'ohlc_complete':bool(r.get('ohlc_complete')),\n\
        \    'source_url':r.get('source_url'),'caveat':'JPX予定日基準。実際の開示時刻・因果関係は未検証'}\nmatched=[{**snap,'observed_return':outcomes[key]}\
        \ for key,snap in frozen.items() if key in outcomes]\nmatched.sort(key=lambda x:(x['earnings_date'],x['code']))\n\
        def stats(rows):\n values=[r['observed_return']['next_close_pct'] for r in rows]\n return {'n':len(values),'rising':sum(x>0\
        \ for x in values),'falling':sum(x<0 for x in values),\n  'rise_rate':round(sum(x>0 for x in values)/len(values),4)\
        \ if values else None,\n  'mean_return_pct':round(sum(values)/len(values),3) if values else None}\ndef factor(name,bound):\n\
        \ valid=[r for r in matched if num(r.get('pre_event_factors',{}).get(name)) is not None]\n hi=[r for r in valid if\
        \ r['pre_event_factors'][name]>=bound]\n lo=[r for r in valid if r['pre_event_factors'][name]<bound]\n return {'name':name,'boundary':bound,'higher':stats(hi),'lower':stats(lo),\n\
        \  'enough_to_compare':len(hi)>=10 and len(lo)>=10}\nchecks=[factor('volume_ratio_5_20',1.5),factor('return_5d_pct',0)]\n\
        completed=sum(e['date']<today for e in events.values())\nprogress=completed/len(events) if events else 0\nmilestones=[]\n\
        for threshold in (.2,.6):\n reached=progress>=threshold\n ready=bool(reached and len(matched)>=30 and any(c['enough_to_compare']\
        \ for c in checks))\n milestones.append({'threshold':threshold,'schedule_threshold_reached':reached,'learning_ready':ready,\n\
        \  'reason':'学習可能。予測点数は自動変更せず検証のみ' if ready else '予定経過率または検証可能標本数が不足'})\nresult={'schema':2,'generated_at':now.isoformat(timespec='seconds'),\n\
        \ 'scope':'時価総額80億円以上1000億円未満。JPX決算予定日2026年10月〜11月。時価総額は現時点値であり過去再現ではない',\n 'coverage':{'season_eligible_companies':len(events),'elapsed_scheduled_events':completed,\n\
        \  'scheduled_progress_fraction':round(progress,4),'frozen_before_event':len(frozen),\n  'newly_frozen':new_count,'matched_nextday_outcomes':len(matched),\n\
        \  'fully_scored_validated_matches':0},\n 'milestones':milestones,'return_summary':stats(matched),'factor_checks':checks,\n\
        \ 'notes':['全市場3305銘柄を母数に使わず、調査対象と同じ時価総額条件を採用',\n  '決算後のデータを事前予測の点数へ変換しない',\n  '翌日反応は予定日基準の値動きであり決算発表の因果効果ではない',\n\
        \  '四季報、会社予想、目標株価、レーティング、ニュースの改定情報が揃わない銘柄は採点しない',\n  '母集団の時価総額は今時点での選別のため過去期間について選択バイアスがある'],\n 'snapshots':sorted(frozen.values(),key=lambda\
        \ x:(x['earnings_date'],x['code'])),\n 'matched_events':matched}\npath=D/'season-learning-v2.json'\npath.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\\\
        n',encoding='utf-8')\nprint('LEARNING_V2',json.dumps(result['coverage'],ensure_ascii=False))\nprint('MILESTONES',json.dumps(milestones,ensure_ascii=False))\n\
        \nPYCODE"
    - name: Commit observations, never retroactive model rankings
      shell: bash
      run: "set -euo pipefail\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add data/season-learning-v2.json\nif git diff --cached --quiet; then echo 'No new observation'; exit 0; fi\ngit\
        \ commit -m 'Track evidence before earnings across full eligible cohort'\nfor n in 1 2 3; do\n git fetch origin main\n\
        \ git rebase origin/main || { git rebase --abort; exit 1; }\n if git push origin HEAD:main; then exit 0; fi\n sleep\
        \ $((n*3))\ndone\nexit 1"
