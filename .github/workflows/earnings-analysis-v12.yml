name: Earnings analysis v12
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/earnings-analysis-v12.yml'
  schedule:
    # 19:30 Japan time, after regular stock quote refresh
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: earnings-analysis-v12
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research app and collector
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip, json
          from pathlib import Path
          files=json.loads(gzip.decompress(base64.b64decode('')).decode('utf-8'))
          for name,content in files.items():
              Path(name).write_text(content,encoding='utf-8')
              print('Prepared',name)
          PYCODE
      - name: Install research dependencies
        run: python -m pip install 'requests>=2.31,<3' 'yfinance>=0.2.60,<1' 'pandas>=2,<3'
      - name: Collect actual financials estimates prior reactions and headlines
        run: python research.py --limit 20
      - name: Validate generated data and app
        shell: bash
        run: |
          python - <<'PYCODE'
          import json,datetime
          from pathlib import Path
          doc=json.loads(Path('data/research.json').read_text(encoding='utf-8'))
          assert isinstance(doc.get('records'),list)
          assert len(doc['records']) <= 20
          assert doc.get('count')==len(doc['records'])
          assert '決算ギャンブルAI v12' in Path('index.html').read_text(encoding='utf-8')
          assert len({r['code'] for r in doc['records']})==len(doc['records'])
          assert all(0<r['market_cap_yen']<100_000_000_000 for r in doc['records'])
          assert all(r['turnover_oku']>=2 for r in doc['records'])
          print('Snapshot validated:', doc['count'], 'records')
          PYCODE
      - name: Upload validated result for recovery
        uses: actions/upload-artifact@v4
        with:
          name: earnings-analysis-v12-result
          path: |
            index.html
            research.py
            data/research.json
          retention-days: 7
      - name: Commit v12 and data with retries
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html research.py data/research.json
          if git diff --cached --quiet; then
            echo 'No update necessary'; exit 0
          fi
          git commit -m 'Update earnings research dashboard v12'
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              echo 'PUBLISHED v12'; exit 0
            fi
            echo "Push attempt $n failed; will retry"
            sleep $((n*5))
          done
          echo 'Publishing failed; result is preserved in Actions artifact' >&2
          exit 1
