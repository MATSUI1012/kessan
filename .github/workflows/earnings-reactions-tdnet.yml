name: Backfill earnings reactions from TDnet disclosure lists
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/earnings-reactions-tdnet.yml
  schedule:
  - cron: 45 12 * * 1-5
permissions:
  contents: write
concurrency:
  group: earnings-tdnet-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Install disclosure index parser
      run: python -m pip install -q requests beautifulsoup4
    - name: Read TDnet dates and calculate reactions
      shell: bash
      run: "python - <<'PY'\nimport json, re, math, time\nfrom collections import defaultdict\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom datetime import date, timedelta, datetime, timezone\nfrom pathlib import Path\nfrom bs4 import BeautifulSoup\nimport requests\nfrom bs4 import BeautifulSoup\n\nDATA=Path('data')\nreport=json.loads((DATA/'research.json').read_text(encoding='utf-8'))\noldpath=DATA/'earnings-reactions.json'\nold=json.loads(oldpath.read_text(encoding='utf-8')) if oldpath.exists() else {}\nprices=json.loads((DATA/'prices.json').read_text(encoding='utf-8'))\nassert isinstance(report.get('records'),list) and isinstance(prices,list)\ntoday=datetime.now(timezone(timedelta(hours=9))).date()\ncodes={str(r['code']) for r in report['records']}\nassert codes\npmap=defaultdict(dict)\nfor x in prices:\n    code=str(x.get('code',''))\n    if code not in codes: continue\n    try:\n        day=date.fromisoformat(str(x['date'])[:10]); close=float(x['close'])\n \
        \       if day <= today and math.isfinite(close) and close>0: pmap[code][day]=close\n    except (ValueError,KeyError,TypeError): continue\n\n# Earnings are usually reported every ~90 days. Search generously around\n# prior quarter anniversaries, NOT by declaring a guessed date as fact.\nscan_days=set()\nfor r in report['records']:\n    anchor=date.fromisoformat(r['earnings_date'])\n    for quarter in (1,2,3,4):\n        center=anchor-timedelta(days=91*quarter)\n        for offset in range(-23,24):\n            d=center+timedelta(days=offset)\n            if today-timedelta(days=405)<=d<=today-timedelta(days=8) and d.weekday()<5:\n                scan_days.add(d)\nscan_days=sorted(scan_days)\n\ndef parse_tdnet(html, when, url):\n    soup=BeautifulSoup(html,'html.parser')\n    found=[]\n    for tr in soup.select('tr'):\n        full=' '.join(tr.stripped_strings)\n        if '決算短信' not in full or any(t in full for t in ('訂正','再訂正','開示事項の経過')): continue\n        if not re.search(r'決算短信',full):continue\n\
        \        hits=re.findall(r'(?<![0-9A-Z])([0-9]{4}[A-Z]?)(?![0-9A-Z])',full)\n        hit=next((x for x in hits if x in codes),None)\n        if hit:\n            found.append((hit,when,full[:240],url))\n    return found\n\ndef fetch_day(day):\n    url=f'https://www.release.tdnet.info/inbs/I_list_001_{day:%Y%m%d}.html'\n    try:\n        res=requests.get(url,headers={'User-Agent':'Mozilla/5.0 (compatible; earnings-research/1.0)'},timeout=11)\n        if res.status_code in (404,410):return ('missing',[],day)\n        res.raise_for_status()\n        res.encoding=res.apparent_encoding or res.encoding\n        body=res.text\n        if '<table' not in body.lower():return ('unrecognized',[],day)\n        return ('parsed',parse_tdnet(body,day,url),day)\n    except Exception as exc:\n        return (type(exc).__name__,[],day)\n\nindexed=defaultdict(dict);stats=defaultdict(int)\nwith ThreadPoolExecutor(max_workers=5) as pool:\n    for status,entries,day in pool.map(fetch_day,scan_days):\n\
        \        stats[status]+=1\n        for code,d,title,url in entries:\n            indexed[code][d]={'title':title,'url':url}\n\n# Existing sourced events remain in place. Do not erase history on outages.\nprevious={str(x.get('code')):x for x in old.get('records',[]) if isinstance(x,dict)}\nresult=[]\nfor row in report['records']:\n    code=str(row['code']); days=sorted(pmap[code].items())\n    reactions={x.get('event_date'):x for x in previous.get(code,{}).get('reactions',[]) if isinstance(x,dict) and x.get('event_date')}\n    for day,meta in sorted(indexed[code].items(),reverse=True):\n        before=[(d,c) for d,c in days if d<day]\n        after=[(d,c) for d,c in days if d>day]\n        if not before or len(after)<5:continue\n        base=before[-1][1]\n        def pct(close):return round((close/base-1)*100,2)\n        reactions[day.isoformat()]={\n            'event_date':day.isoformat(),\n            'date_kind':'TDnet決算短信の掲載日（開示時刻未確認）',\n            'source_url':meta['url'],\n\
        \            'headline':meta['title'],\n            'baseline_date':before[-1][0].isoformat(),\n            'baseline_close':base,\n            'after_1d_date':after[0][0].isoformat(),\n            'after_1d_pct':pct(after[0][1]),\n            'after_3d_pct':pct(after[2][1]),\n            'after_5d_pct':pct(after[4][1]),\n            'method':'TDnet決算短信の掲載日より前の終値→掲載日後の1/3/5営業日終値。開示時刻未検証。因果・予測ではない。'\n        }\n    result.append({'code':code,'name':row.get('name',''),\n                   'reactions':sorted(reactions.values(),key=lambda x:x['event_date'],reverse=True)[:8]})\n\n# Do not replace a real dataset with guesses. Empty data is honestly empty.\nnew=dict(old)\nnew.update({'schema':2,'description':'TDnet決算短信の掲載日付近の終値反応。開示時刻未確認、決算による因果効果や上昇確率は示さない。',\n 'sources':['TDnet決算短信開示一覧（掲載日）','既存の出典付き履歴'],\n 'tdnet_days_requested':len(scan_days),\n 'tdnet_days_parsed':stats['parsed'],\n 'tdnet_events_found':sum(map(len,indexed.values())),\n 'tdnet_scan_diagnostics':dict(stats),\n 'with_reactions':sum(bool(x['reactions'])\
        \ for x in result),\n 'records':result})\n# Retain old generated_at if observations and diagnostics are identical.\ncomp=lambda x:{k:v for k,v in x.items() if k!='generated_at'}\nif comp(new)!=comp(old):\n    new['generated_at']=datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')\n    oldpath.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nprint('TDNET:',json.dumps({'days_requested':len(scan_days),'days_parsed':stats['parsed'],\n'events_found':sum(map(len,indexed.values())),'reactions':sum(len(x['reactions']) for x in result),\n'stocks':new['with_reactions'],'errors':dict(stats)},ensure_ascii=False))\nassert len(result)==len(report['records'])\nassert all(x['baseline_date']<x['event_date']<x['after_1d_date'] for r in result for x in r['reactions'])\nPY"
    - name: Commit non-invented sourced history
      shell: bash
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add data/earnings-reactions.json\nif git diff --cached --quiet; then echo 'No verified new data'; exit 0; fi\ngit commit -m 'Backfill historical earnings reactions from TDnet disclosure dates'\nfor n in 1 2 3; do\n  git fetch origin main\n  git rebase origin/main || { git rebase --abort; exit 1; }\n  if git push origin HEAD:main; then exit 0; fi\n  sleep $((n*5))\ndone\nexit 1"
