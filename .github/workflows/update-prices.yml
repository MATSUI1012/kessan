name: Deploy v11 and update stock data
'on':
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy v11 app on manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64, gzip
          payload = ''
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(payload)))
          print('Deployed v11 HTML')
          PYCODE
      - name: Commit v11 app immediately
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish v11 earnings shortlist interface'
            git push
          fi
      - name: Install price dependencies
        run: python -m pip install requests yfinance
      - name: Update stock prices and market caps
        run: python update-prices.py
      - name: Commit updated market data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json data/market-caps.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update prices and market caps'
            git push
          fi
