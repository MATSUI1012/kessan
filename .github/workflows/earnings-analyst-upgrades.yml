name: Analyst revision 61-day headline tracker
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/earnings-analyst-upgrades.yml
  schedule:
  - cron: 55 14 * * 1-5
permissions:
  contents: write
concurrency:
  group: earnings-analyst-revisions
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true
    - name: Install headline client
      run: python -m pip install -q requests
    - name: Check last 61 days for dated upgrades and render ranking
      shell: python {0}
      run: "import json, re\nfrom datetime import datetime, timedelta, timezone\nfrom email.utils import parsedate_to_datetime\nfrom pathlib import Path\nfrom urllib.parse import quote\nimport requests\n\nJST=timezone(timedelta(hours=9))\nnow=datetime.now(JST)\ncutoff=(now-timedelta(days=61)).date()\nroot=Path('data')\nresearch=json.loads((root/'research.json').read_text(encoding='utf-8'))\nassert isinstance(research.get('records'),list)\nold_path=root/'analyst-upgrades.json'\ntry:\n    old=json.loads(old_path.read_text(encoding='utf-8'))\nexcept (OSError,ValueError):\n    old={}\nprevious={str(x['code']):x for x in old.get('records',[]) if isinstance(x,dict) and 'code' in x}\n\n# Verify that a dated headline explicitly reports an upgraded rating, or an\n# upward revision of ANALYST CONSENSUS. A price-target rise alone is excluded.\nrating_phrases=[\n    re.compile(r'(?:投資判断|レーティング).{0,22}(?:引き上げ|格上げ|上方修正)',re.I),\n    re.compile(r'(?:引き上げ|格上げ).{0,12}(?:投資判断|レーティング)',re.I),\n]\nconsensus_phrases=[\n\
        \    re.compile(r'(?:コンセンサス|市場予想|アナリスト予想).{0,24}(?:上方修正|上方改定|引き上げ|切り上が)',re.I),\n    re.compile(r'(?:上方修正|上方改定|引き上げ).{0,18}(?:コンセンサス|アナリスト予想)',re.I),\n]\n\ndef kind_of(title):\n    # No credit for company guidance, a higher TP or a generic positive report.\n    if re.search(r'(?:目標株価|目標価格).{0,10}(?:引き上げ|上方修正)',title) and not re.search(r'(?:投資判断|レーティング|コンセンサス|市場予想|アナリスト予想)',title):\n        return None\n    if any(p.search(title) for p in rating_phrases):return 'rating_upgrade'\n    if any(p.search(title) for p in consensus_phrases):return 'consensus_up_revision'\n    return None\n\ndef pub_date(value):\n    try:\n        v=parsedate_to_datetime(value)\n        if v.tzinfo is None:v=v.replace(tzinfo=timezone.utc)\n        return v.astimezone(JST).date()\n    except (ValueError,TypeError,OverflowError):return None\n\ndef verify_article(title,code,name):\n    # Code must be visible as an isolated stock code, not part of another code.\n    has_code=bool(re.search(r'(?<![0-9A-Z])'+re.escape(code)+r'(?![0-9A-Z])',title,re.I))\n\
        \    has_name=bool(name and len(name)>=4 and name in title)\n    return (has_code or has_name) and kind_of(title)\n\nfound={}\nfor r in research['records']:\n    code=str(r.get('code',''))\n    name=str(r.get('name') or '')\n    if not code:continue\n    verified=[]\n    # Retain previously observed, sourced announcements while within 61 days.\n    for x in previous.get(code,{}).get('events',[]):\n        try:day=datetime.strptime(x['date'],'%Y-%m-%d').date()\n        except (KeyError,ValueError,TypeError):continue\n        if cutoff<=day<=now.date() and x.get('kind') in ('rating_upgrade','consensus_up_revision') and str(x.get('source_url','')).startswith('https://') and verify_article(str(x.get('title','')),code,name)==x.get('kind'):\n            verified.append(x)\n    # Focused free public headlines. Source timestamps must be parseable.\n    q=f'\"{code}\" (\"投資判断引き上げ\" OR \"レーティング引き上げ\" OR \"コンセンサス上方修正\") when:61d'\n    url='https://news.google.com/rss/search?q='+quote(q)+'&hl=ja&gl=JP&ceid=JP:ja'\n\
        \    try:\n        import xml.etree.ElementTree as ET\n        response=requests.get(url,timeout=15,headers={'User-Agent':'Mozilla/5.0 earnings-research/1.0'})\n        response.raise_for_status()\n        feed=ET.fromstring(response.content)\n        for item in feed.findall('.//item')[:40]:\n            title=(item.findtext('title') or '').strip()\n            link=(item.findtext('link') or '').strip()\n            dt=pub_date(item.findtext('pubDate'))\n            kind=verify_article(title,code,name)\n            if not (dt and cutoff<=dt<=now.date() and kind and link.startswith('https://')):continue\n            verified.append({'date':dt.isoformat(),'kind':kind,'title':title,'source_url':link,'method':'掲載日時付きのニュース見出し。本文・格付け原本は未照合'})\n    except Exception as exc:\n        print('RSS_UNAVAILABLE',code,type(exc).__name__)\n    distinct={}\n    for x in verified:\n        distinct[(x['date'],x['kind'],x['title'])]=x\n    events=sorted(distinct.values(),key=lambda x:(x['date'],x['kind']),reverse=True)[:20]\n\
        \    kinds={x['kind'] for x in events}\n    # Conservative headline-only confidence: separate from fully verified revisions.\n    found[code]={'code':code,'name':name,'events':events,\n        'rating_upgrade_points':2 if 'rating_upgrade' in kinds else 0,\n        'consensus_revision_points':2 if 'consensus_up_revision' in kinds else 0,\n        'score':2*int('rating_upgrade' in kinds)+2*int('consensus_up_revision' in kinds),\n        'status':'見出しに上方修正・格上げの記載あり（原文未照合）' if kinds else '確認できる上方修正記事なし'}\n\nnew={'schema':1,'updated_at':now.isoformat(timespec='seconds'),'window_start':cutoff.isoformat(),\n    'window_end':now.date().isoformat(),\n    'description':'ニュース見出しを用いた暫定検出。原文の格付け変更・コンセンサス時系列を検証したものではない。目標株価の引き上げ単独では加点しない。',\n    'records':list(found.values())}\nold_without_time={k:v for k,v in old.items() if k!='updated_at'}\nnew_without_time={k:v for k,v in new.items() if k!='updated_at'}\nif new_without_time==old_without_time:\n    print('UNCHANGED_UPGRADES',sum(bool(x['score'])\
        \ for x in found.values()))\nelse:\n    old_path.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\n    print('RECORDED_UPGRADES',sum(bool(x['score']) for x in found.values()),'of',len(found))\n\nhtml_path=Path('index.html')\nhtml=html_path.read_text(encoding='utf-8')\nmarker='<!-- ANALYST_UPGRADE_RANKING_V1 -->'\nif marker not in html:\n    panel=r''' <!-- ANALYST_UPGRADE_RANKING_V1 -->\n<section class=\"panel\" id=\"upgradeRankingPanel\"><h2>⑩ 直近2か月の市場予想・レーティング上方修正</h2>\n<p class=\"muted\">対象：現在の決算候補20銘柄。見出しでコンセンサス上方修正または投資判断引き上げを確認できた場合、各＋2点（最大4点）。根拠のない推測は加点しません。記事見出しは一次資料で未照合のため暫定評価です。</p><p id=\"upgradeStatus\">確認中…</p><div id=\"upgradeResults\"></div></section>\n<script>\n(async()=>{'use strict';\nconst esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\ntry{\n const [rr,uu]=await Promise.all([fetch('./data/research.json',{cache:'no-store'}),fetch('./data/analyst-upgrades.json',{cache:'no-store'})]);\n\
        \ if(!rr.ok||!uu.ok)throw Error('データ未公開');\n const r=await rr.json(),u=await uu.json();\n if(!Array.isArray(r.records)||!Array.isArray(u.records))throw Error('データ形式不正');\n const mp=new Map(u.records.map(x=>[String(x.code),x]));\n const rows=r.records.map(x=>{const rev=mp.get(String(x.code))||{};\n const volume=Number(x.volume_ratio_5_20)>=1.5?2:0;\n const score=volume+Number(rev.score||0);\n return {...x,rev,volume,score};}).sort((a,b)=>b.score-a.score||String(a.earnings_date).localeCompare(String(b.earnings_date))||String(a.code).localeCompare(String(b.code)));\n const raised=rows.filter(x=>x.rev.score>0).length;\n document.getElementById('upgradeStatus').textContent='見出しで上方修正・格上げが見つかった候補 '+raised+' / '+rows.length+'銘柄 ／ 記事未確認は0点（上方修正なしとは限りません）';\n document.getElementById('upgradeResults').innerHTML=rows.map((x,i)=>'<details class=\"item\"><summary>'+esc(i+1)+'位 '+esc(x.name)+'（'+esc(x.code)+'） ／ 暫定 '+esc(x.score)+'点</summary><p>出来高変化 '+esc(x.volume)+'点 ／ 直近2か月のコンセンサス修正 '+esc(x.rev.consensus_revision_points||0)+'点\
        \ ／ レーティング '+esc(x.rev.rating_upgrade_points||0)+'点</p><p class=\"muted small\">候補自身の過去決算反応・同業の直近決算反応は、この暫定順位にはまだ加点していません。</p>'+((x.rev.events||[]).map(z=>'<p>'+esc(z.date)+'：'+esc(z.title)+'　<a href=\"'+esc(z.source_url)+'\" target=\"_blank\" rel=\"noopener noreferrer\">記事</a></p>').join('')||'<p>直近2か月の該当ニュースは未確認</p>')+'</details>').join('');\n}catch(e){document.getElementById('upgradeStatus').textContent='取得失敗：'+e.message;}\n})();\n</script>\n'''\n    if html.count('</body>')!=1:raise RuntimeError('Unexpected HTML body count')\n    html=html.replace('</body>',panel+'</body>',1)\n    html_path.write_text(html,encoding='utf-8')\nassert html.count(marker)==1\n"
    - name: Commit source-linked evidence and app panel
      shell: bash
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add data/analyst-upgrades.json index.html\nif git diff --cached --quiet; then echo 'No new evidence'; exit 0; fi\ngit commit -m 'Track dated analyst upgrades from public headlines'\nfor n in 1 2 3; do\n  git fetch origin main\n  git rebase origin/main || { git rebase --abort; exit 1; }\n  if git push origin HEAD:main; then exit 0; fi\n  sleep $((n*5))\ndone\nexit 1"
